services:
  db:
    image: postgres:16
    container_name: getit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: getit
      POSTGRES_USER: getit
      POSTGRES_PASSWORD: getit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
