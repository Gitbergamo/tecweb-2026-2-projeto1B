{% extends "notes/base.html" %}
{% load static %}

{% block content %}
<div class="appbar">
  <img src="{% static 'notes/img/logo-getit.png' %}" class="logo" />
  <span class="subtitle">Como o Post-it, mas com outro verbo</span>
</div>

<main class="container">
  <h1 class="page-title">Anotações com a tag "{{ tag.nome }}"</h1>

  <div class="card-container">
    {% for note in notes %}
    <div class="card">
      <h3 class="card-title">{{ note.title }}</h3>
      <div class="card-content">
        <p>{{ note.content }}</p>
      </div>
    </div>
    {% endfor %}
  </div>

  <div class="confirm-actions">
    <a class="btn btn-secondary" href="{% url 'tags' %}">Voltar</a>
  </div>
</main>
{% endblock %}
